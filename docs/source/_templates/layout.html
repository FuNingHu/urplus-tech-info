{% extends "!layout.html" %}

{% block footer %}
{{ super() }}

<div class="site-visit-counter" style="text-align:center; margin:16px 0; clear:both;">
  <img referrerpolicy="no-referrer-when-downgrade"
       src="https://api.visitorbadge.io/api/visitors?path=funinghu.github.io%2Furplus-tech-info&label=Page%20views&labelColor=%23555555&countColor=%237e3c9e&style=flat"
       alt="Total page views" />
</div>

{% if versions %}
<div class="rst-versions" data-toggle="rst-versions" role="note" aria-label="Versions">
  <span class="rst-current-version" data-toggle="rst-current-version">
    <span class="fa fa-book"></span>
    v: {{ current_version.name }}
    <span class="fa fa-caret-down"></span>
  </span>
  <div class="rst-other-versions">
    <dl>
      <dt>Versions</dt>
      {% for item in versions %}
      <dd><a href="{{ item.url }}">{{ item.name }}</a></dd>
      {% endfor %}
    </dl>
  </div>
</div>
{% endif %}

{% endblock %}
